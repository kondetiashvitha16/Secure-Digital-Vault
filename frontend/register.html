<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Secure Digital Vault</title>
  <meta name="description" content="Register your private account on Secure Digital Vault to safely store, organize, and manage your files.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .auth-header {
      margin-bottom: 2rem;
    }
    .auth-icon {
      width: 56px;
      height: 56px;
      background: var(--accent-emerald-glow);
      border: 1px solid var(--accent-emerald);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 1rem auto;
    }
  </style>
</head>
<body>

  <!-- Clean Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">🛡️</div>
        <span>Secure Digital Vault</span>
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="login.html" class="btn btn-outline btn-sm">Sign In</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Register Form Container -->
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">🛡️</div>
        <h2>Create Account</h2>
        <p style="margin-top: 0.35rem;">Sign up to start securely managing your private files</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="e.g. alex_user" required minlength="3" maxlength="30" autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="user@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-password-wrapper">
            <input type="password" id="reg-password" class="form-input" placeholder="Min 8 chars, 1 uppercase, 1 number" required minlength="8" autocomplete="new-password">
            <button type="button" class="password-toggle-btn" title="Toggle password visibility">👁️</button>
          </div>
          <div class="strength-meter">
            <div id="strength-bar" class="strength-bar"></div>
          </div>
          <div id="strength-text" class="strength-text"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <div class="input-password-wrapper">
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter your password" required minlength="8" autocomplete="new-password">
            <button type="button" class="password-toggle-btn" title="Toggle password visibility">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn btn-emerald" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem; font-size: 1rem;">
          Create Account
        </button>
      </form>

      <div style="margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
        Already have an account? <a href="login.html" style="font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- Clean Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <div style="font-weight: 700; color: var(--text-primary);">🛡️ Secure Digital Vault</div>
      <div>Simple, private and secure file management.</div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
